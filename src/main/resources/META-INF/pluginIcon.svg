<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Background -->
  <rect width="40" height="40" rx="6" fill="#1E1F22"/>

  <!-- Left JSON panel -->
  <rect x="2" y="4" width="15" height="22" rx="2.5" fill="#2B2D30"/>
  <rect x="2" y="4" width="15" height="22" rx="2.5" fill="none" stroke="#4D9375" stroke-width="1"/>

  <!-- Left panel: { brace top -->
  <text x="4.5" y="11" font-family="monospace" font-size="5.5" font-weight="bold" fill="#4D9375">{</text>
  <!-- Left panel: key-value lines -->
  <rect x="5" y="13" width="5" height="1.2" rx="0.6" fill="#6897BB"/>
  <rect x="11" y="13" width="4" height="1.2" rx="0.6" fill="#CE9178"/>
  <!-- highlight line (different) -->
  <rect x="5" y="15.5" width="5" height="1.2" rx="0.6" fill="#6897BB"/>
  <rect x="11" y="15.5" width="4" height="1.2" rx="0.6" fill="#E06C75" opacity="0.9"/>
  <rect x="4" y="14.8" width="13" height="2.7" rx="1" fill="#E06C75" fill-opacity="0.15"/>
  <!-- more lines -->
  <rect x="5" y="18" width="5" height="1.2" rx="0.6" fill="#6897BB"/>
  <rect x="11" y="18" width="3" height="1.2" rx="0.6" fill="#CE9178"/>
  <rect x="5" y="20.5" width="4" height="1.2" rx="0.6" fill="#6897BB"/>
  <rect x="10" y="20.5" width="5" height="1.2" rx="0.6" fill="#CE9178"/>
  <!-- } brace bottom -->
  <text x="4.5" y="27" font-family="monospace" font-size="5.5" font-weight="bold" fill="#4D9375">}</text>

  <!-- Right JSON panel -->
  <rect x="23" y="4" width="15" height="22" rx="2.5" fill="#2B2D30"/>
  <rect x="23" y="4" width="15" height="22" rx="2.5" fill="none" stroke="#4D9375" stroke-width="1"/>

  <!-- Right panel: { brace top -->
  <text x="25.5" y="11" font-family="monospace" font-size="5.5" font-weight="bold" fill="#4D9375">{</text>
  <!-- Right panel: key-value lines -->
  <rect x="26" y="13" width="5" height="1.2" rx="0.6" fill="#6897BB"/>
  <rect x="32" y="13" width="4" height="1.2" rx="0.6" fill="#CE9178"/>
  <!-- highlight line (different value) -->
  <rect x="26" y="15.5" width="5" height="1.2" rx="0.6" fill="#6897BB"/>
  <rect x="32" y="15.5" width="5" height="1.2" rx="0.6" fill="#98C379" opacity="0.9"/>
  <rect x="25" y="14.8" width="14" height="2.7" rx="1" fill="#98C379" fill-opacity="0.15"/>
  <!-- more lines -->
  <rect x="26" y="18" width="5" height="1.2" rx="0.6" fill="#6897BB"/>
  <rect x="32" y="18" width="3" height="1.2" rx="0.6" fill="#CE9178"/>
  <rect x="26" y="20.5" width="4" height="1.2" rx="0.6" fill="#6897BB"/>
  <rect x="31" y="20.5" width="5" height="1.2" rx="0.6" fill="#CE9178"/>
  <!-- } brace bottom -->
  <text x="25.5" y="27" font-family="monospace" font-size="5.5" font-weight="bold" fill="#4D9375">}</text>

  <!-- Center diff arrows -->
  <line x1="18" y1="15" x2="22" y2="15" stroke="#FFB86C" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="21,13.5 23,15 21,16.5" fill="#FFB86C"/>
  <polygon points="19,13.5 17,15 19,16.5" fill="#FFB86C"/>

  <!-- Bottom diff indicator bar -->
  <rect x="4" y="29" width="32" height="3" rx="1.5" fill="#2B2D30"/>
  <rect x="4" y="29" width="10" height="3" rx="1.5" fill="#E06C75" fill-opacity="0.8"/>
  <rect x="16" y="29" width="4" height="3" rx="1.5" fill="#4D9375" fill-opacity="0.6"/>
  <rect x="22" y="29" width="14" height="3" rx="1.5" fill="#98C379" fill-opacity="0.8"/>

  <!-- Bottom label -->
  <text x="20" y="37" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#8B949E" text-anchor="middle" letter-spacing="0.5">JSON DIFF</text>
</svg>
